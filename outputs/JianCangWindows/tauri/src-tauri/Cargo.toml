[package]
name = "jiancang-tauri"
version = "0.36.45"
edition = "2021"
description = "见藏 Windows 素材管理工具"

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "=2.11.5"
tauri-plugin-dialog = "=2.7.3"

[target.'cfg(windows)'.dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.4"
webview2-com = "=0.38.2"
winreg = "=0.55.0"
windows = { version = "=0.61.3", features = ["Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
